# Checks every pull request and every push to main (JS-01, JS-03, JS-40, JS-77).
# Third-party actions are pinned to a full commit SHA; the comment names the release.
# Dependabot (.github/dependabot.yml) proposes updates to these pins and to npm packages.
name: web-ci

on:
  pull_request: {}
  push:
    branches: [main]

# Read-only by default; no job needs more.
permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Lockfile install; .npmrc applies the 7-day release-age cooldown and blocks git/URL dependencies.
      - run: npm ci

      # Fails on a known vulnerability of high or critical severity.
      - run: npm audit --audit-level=high

      - run: npm run lint
      # `npm run format:check` is added here with the one-time Prettier
      # reformat, after the open web PRs that build on this branch are merged.
      - run: npm run typecheck
      - run: npm test

      # The production build, then a scan of dist/ for source maps, simulation
      # code, dummy data and anything that looks like a secret.
      - run: npm run build
      - run: npm run check:build

  # Browser tests (Playwright) are not run here: they use the local dummy data in
  # src/mocks/data.ts, which by team rule is never committed. They run locally
  # (`npm run test:e2e`) before every push. See docs/release.md.
